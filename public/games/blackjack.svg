  <text x="36" y="278" fill="#aad4b4" font-family="Tahoma, Segoe UI, sans-serif" font-size="16" letter-spacing="1.4">YOU · 18</text>
  <g font-family="Tahoma, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="36" y="294" width="72" height="102" rx="4" fill="#f7f1e4" stroke="#d9d2c5"/>
    <text x="72" y="354" fill="#c42b3a">8♥</text>
