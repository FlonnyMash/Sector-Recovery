  <text x="924" y="48" text-anchor="end" fill="#e8f6ea" font-family="Consolas, monospace" font-size="16">Chips: 420 · High score: 740</text>

  <text x="36" y="108" fill="#aad4b4" font-family="Tahoma, Segoe UI, sans-serif" font-size="16" letter-spacing="1.4">DEALER</text>
  <g font-family="Tahoma, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="36" y="124" width="72" height="102" rx="4" fill="#f7f1e4" stroke="#d9d2c5"/>
    <text x="72" y="184" fill="#1a1a1a">A♠</text>
    <rect x="120" y="124" width="72" height="102" rx="4" fill="#3a2060" stroke="#3a2060"/>
